name: Package picture-to-circuit scripts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4

      - name: Create script archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          archive="picture-to-circuit-scripts-${GITHUB_REF_NAME}"
          tar -czf "release/${archive}.tar.gz" README.md scripts
          zip -q -r "release/${archive}.zip" README.md scripts
          (cd release && sha256sum "${archive}.tar.gz" "${archive}.zip" > SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Picture-to-Circuit scripts $GITHUB_REF_NAME" \
            --notes "Cross-platform launchers only. Provide a compatible Logisim JAR containing com.cburch.logisim.gui.paint.PaintTool via LOGISIM_JAR." \
            --latest
